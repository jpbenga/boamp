<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>BOAMP Faisabilité V2</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><main class="max-w-7xl mx-auto p-6 space-y-6">
<header class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6"><h1 class="text-2xl font-bold">Faisabilité complète 1-2-5-6 (V2)</h1><p id="meta" class="text-slate-300 mt-2"></p></header>
<section id="kpis" class="grid md:grid-cols-4 gap-4"></section>
<section class="grid lg:grid-cols-2 gap-4"><div class="rounded-2xl border border-slate-800 bg-slate-900 p-4"><h2 class="font-semibold">Étape 1</h2><ul id="step1" class="text-sm mt-2 space-y-1"></ul></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-4"><h2 class="font-semibold">Étape 2</h2><ul id="step2" class="text-sm mt-2 space-y-1"></ul></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-4"><h2 class="font-semibold">Étape 5</h2><ul id="step5" class="text-sm mt-2 space-y-1"></ul></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-4"><h2 class="font-semibold">Étape 6</h2><ul id="step6" class="text-sm mt-2 space-y-1"></ul></div></section>
<section class="rounded-2xl border border-slate-800 bg-slate-900 p-4 space-y-3"><h2 class="font-semibold text-lg">Profils entreprise & matching</h2><select id="companySelect" class="bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm"></select><div id="companySummary" class="text-sm text-slate-300"></div><div class="overflow-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-400 border-b border-slate-700"><th class="py-2">Offre</th><th>Score</th><th>Décision</th><th>Acheteur</th><th>Publication</th><th>Deadline</th><th>Détails</th></tr></thead><tbody id="offersRows"></tbody></table></div></section>
<section class="rounded-2xl border border-rose-700/40 bg-rose-950/20 p-4"><h2 class="font-semibold text-rose-300">Erreurs</h2><div id="errors" class="text-sm mt-2"></div></section>
</main>
<script>
let dashboard;
async function boot(){const res=await fetch('/api/dashboard');dashboard=await res.json();renderTop();renderSteps();renderProfiles();renderErrors();}
function renderTop(){document.getElementById('meta').textContent=`Run: ${dashboard.runDate||'N/A'} · Appels ${dashboard.calls.success}/${dashboard.calls.total} (échecs: ${dashboard.calls.failed})`;const k=[['Profils',dashboard.companyProfiles.length],['Scorings',dashboard.matching.total],['Score moyen',dashboard.matching.averageScore],['Complétude deadline',dashboard.completeness.responseDeadlinePct+'%']];document.getElementById('kpis').innerHTML=k.map(([l,v])=>`<div class='rounded-xl border border-slate-800 bg-slate-900 p-4'><p class='text-xs uppercase text-slate-400'>${l}</p><p class='text-2xl font-semibold'>${v}</p></div>`).join('');}
function fill(id,items){document.getElementById(id).innerHTML=items.map(i=>`<li>• <span class='font-medium'>${i.label}:</span> ${i.value}</li>`).join('');}
function renderSteps(){fill('step1',dashboard.steps.step1);fill('step2',dashboard.steps.step2);fill('step5',dashboard.steps.step5);fill('step6',dashboard.steps.step6);}
function renderProfiles(){const s=document.getElementById('companySelect');s.innerHTML=dashboard.companyProfiles.map((c,i)=>`<option value='${i}'>${c.companyName} (${c.activity})</option>`).join('');s.onchange=()=>renderOffers(Number(s.value));renderOffers(0);}
function renderOffers(i){const c=dashboard.companyProfiles[i];if(!c)return;document.getElementById('companySummary').textContent=`Moyenne ${c.averageScore}/100 · Prioritaire: ${c.totals['prioritaire']} · Pertinent: ${c.totals['pertinent']} · À examiner: ${c.totals['à examiner']} · Hors cible: ${c.totals['hors cible']}`;document.getElementById('offersRows').innerHTML=c.offers.map(o=>`<tr class='border-b border-slate-800 align-top'><td class='py-2 pr-2'>${o.title||'-'}</td><td>${o.score}</td><td>${o.decision}</td><td>${o.buyerName||'-'}</td><td>${o.publicationDate||'-'}</td><td>${o.responseDeadline||'-'}</td><td class='text-xs'><div>Raisons: ${(o.reasons||[]).join(' ; ')||'-'}</div><div class='text-rose-300'>Risques: ${(o.risks||[]).join(' ; ')||'-'}</div></td></tr>`).join('');}
function renderErrors(){const e=document.getElementById('errors');e.innerHTML=dashboard.errors.length?dashboard.errors.map(x=>`<p class='text-rose-200'>• ${x}</p>`).join(''):`<p class='text-emerald-300'>Aucune erreur.</p>`;}
boot().catch(e=>document.getElementById('errors').innerHTML=`<p class='text-rose-300'>Erreur: ${e.message}</p>`);
</script></body></html>
